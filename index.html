<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>受付管理システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAuBDeBGX4ZEoJzUumsEX7PYAEF5N-twHM",
            authDomain: "wedding-874f2-cof.firebaseapp.com",
            projectId: "wedding-874f2-cof",
            storageBucket: "wedding-874f2-cof.firebasestorage.app",
            messagingSenderId: "865432441403",
            appId: "1:865432441403:web:b382deea2f0e4b66a6c21e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = "wedding-874f2-cof";
        const COLLECTION_REF = collection(db, 'artifacts', APP_ID, 'public', 'data', 'guests');

        let guests = [];
        let activeTableFilter = 'all';
        let showCheckedOnly = false; // ★追加：受付済のみ表示フラグ
        let unsubscribe = null;
        let pendingAction = null;

        const normalizeText = (str) => {
            if (!str) return "";
            return String(str)
                .replace(/[！-～]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
                .replace(/\s+/g, "")
                .replace(/table-/g, "")
                .toUpperCase();
        };

        async function startApp() {
            try {
                await signInAnonymously(auth);
            } catch (e) {
                console.error("Auth Error:", e);
                showError("ログインに失敗しました。");
            }
            onAuthStateChanged(auth, (user) => {
                if (user) initListener();
            });
        }

        function initListener() {
            if (unsubscribe) unsubscribe();
            unsubscribe = onSnapshot(COLLECTION_REF, (snapshot) => {
                guests = snapshot.docs.map(d => {
                    const data = d.data();
                    const rawTable = data.tableID || data.table || "不明";
                    return { 
                        id: d.id, 
                        ...data,
                        displayTable: normalizeText(rawTable)
                    };
                });
                updateTableTabs();
                render();
            }, (err) => {
                showError("データの読み取り権限がありません。");
            });
        }

        function showError(msg) {
            document.getElementById('guest-list').innerHTML = `<div class="p-10 text-center text-red-500 font-bold">${msg}</div>`;
        }

        window.confirmToggle = (guestId, currentStatus, guestName) => {
            pendingAction = { guestId, currentStatus };
            const modal = document.getElementById('confirm-modal');
            const message = document.getElementById('modal-message');
            const confirmBtn = document.getElementById('modal-confirm-btn');

            message.innerHTML = `
                <div class="text-lg font-bold mb-1">${guestName} 様</div>
                <div class="text-sm text-gray-500">
                    ${currentStatus ? '受付を「未受付」に戻しますか？' : '受付を完了しますか？'}
                </div>
            `;

            confirmBtn.className = `flex-1 py-4 rounded-2xl font-bold text-white transition-all active:scale-95 ${currentStatus ? 'bg-orange-500' : 'bg-blue-600'}`;
            confirmBtn.innerText = currentStatus ? '未受付に戻す' : '受付を完了する';

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeModal = () => {
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            pendingAction = null;
        };

        window.executeToggle = async () => {
            if (!pendingAction) return;
            const { guestId, currentStatus } = pendingAction;
            closeModal();
            const guestRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'guests', guestId);
            try {
                await updateDoc(guestRef, {
                    checkedIn: !currentStatus,
                    checkInTime: !currentStatus ? new Date().toISOString() : null
                });
            } catch (e) {
                console.error("Update Error:", e);
            }
        };

        function updateTableTabs() {
            const tableSet = new Set();
            guests.forEach(g => { if (g.displayTable) tableSet.add(g.displayTable); });
            const sortedTables = Array.from(tableSet).sort();
            const container = document.getElementById('table-tabs');
            
            const btnBase = "px-6 py-2 rounded-full text-sm font-bold shrink-0 transition-all border ";
            let html = `<button onclick="setFilter('all')" class="${btnBase} ${activeTableFilter === 'all' ? 'bg-black text-white border-black shadow-md' : 'bg-white text-gray-500 border-gray-200'}">すべて</button>`;
            
            sortedTables.forEach(t => {
                const isActive = activeTableFilter === t;
                html += `<button onclick="setFilter('${t}')" class="${btnBase} ${isActive ? 'bg-black text-white border-black shadow-md' : 'bg-white text-gray-500 border-gray-200'}">${t}</button>`;
            });
            container.innerHTML = html;
        }

        window.setFilter = (t) => {
            activeTableFilter = t;
            updateTableTabs();
            render();
        };

        // ★追加：受付済フィルタの切り替え
        window.toggleCheckedFilter = () => {
            showCheckedOnly = !showCheckedOnly;
            render();
        };

        function render() {
            const list = document.getElementById('guest-list');
            const search = (document.getElementById('search-input')?.value || "").toLowerCase();
            
            // ★フィルタリングロジックの修正
            let filtered = guests.filter(g => {
                const nameMatch = (g.name || "").toLowerCase().includes(search) || (g.kana || "").toLowerCase().includes(search);
                const tableMatch = activeTableFilter === 'all' || g.displayTable === activeTableFilter;
                const checkMatch = showCheckedOnly ? g.checkedIn === true : true; // 受付済フィルタ適用
                return nameMatch && tableMatch && checkMatch;
            });

            filtered.sort((a, b) => (a.kana || "").localeCompare(b.kana || "", 'ja'));

            const checkedCount = guests.filter(g => g.checkedIn).length;
            
            // ★統計表示（ボタン）の更新
            const statsBtn = document.getElementById('stats');
            statsBtn.innerText = `受付済: ${checkedCount} / ${guests.length}`;
            if (showCheckedOnly) {
                statsBtn.className = "text-[10px] font-bold bg-green-500 text-white px-3 py-1 rounded-full border border-green-600 shadow-sm transition-colors active:scale-95";
            } else {
                statsBtn.className = "text-[10px] font-bold text-gray-500 bg-white px-3 py-1 rounded-full border shadow-sm transition-colors active:scale-95";
            }

            if (filtered.length === 0) {
                list.innerHTML = `<div class="p-20 text-center text-gray-400 font-bold">${showCheckedOnly ? '受付済のゲストはいません' : '該当するゲストはいません'}</div>`;
                return;
            }

            list.innerHTML = filtered.map(g => `
                <div class="flex items-center justify-between p-5 border-b bg-white last:border-0">
                    <div class="flex-grow">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-lg text-gray-800">${g.name || '名前なし'}</span>
                            <span class="text-[10px] font-black bg-gray-100 text-gray-600 px-2 py-0.5 rounded border border-gray-200">${g.displayTable}</span>
                        </div>
                        <div class="text-xs text-gray-400 font-medium">${g.kana || ''}</div>
                    </div>
                    <button onclick="confirmToggle('${g.id}', ${g.checkedIn || false}, '${g.name}')" 
                        class="px-6 py-3 rounded-xl text-sm font-bold transition-all ${g.checkedIn ? 'bg-green-50 text-green-600 border border-green-200' : 'bg-blue-600 text-white shadow-md active:scale-95'}">
                        ${g.checkedIn ? '受付済' : '受付'}
                    </button>
                </div>
            `).join('');
        }

        window.onInputSearch = () => render();
        window.onload = startApp;
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop {
            0% { transform: scale(0.9) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24">

    <!-- Header Area -->
    <div class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b shadow-sm">
        <div class="max-w-2xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-black text-gray-900 tracking-tight">GUEST CHECK-IN</h1>
                <!-- divをbuttonに変更し、onclickを追加 -->
                <button id="stats" onclick="toggleCheckedFilter()" class="text-[10px] font-bold text-gray-500 bg-white px-3 py-1 rounded-full border shadow-sm transition-colors active:scale-95">読み込み中...</button>
            </div>

            <div id="table-tabs" class="flex gap-2 overflow-x-auto pb-3 no-scrollbar">
                <!-- タブ生成 -->
            </div>

            <div class="relative">
                <input type="text" id="search-input" oninput="onInputSearch()" placeholder="名前・ふりがなで検索" 
                    class="w-full p-4 pl-12 bg-gray-100 border-none rounded-2xl font-medium focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-inner">
                <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Main List -->
    <div class="max-w-2xl mx-auto px-4 mt-6">
        <div id="guest-list" class="bg-white rounded-[2rem] border border-gray-100 shadow-xl overflow-hidden min-h-[400px]">
            <div class="p-20 text-center text-gray-300">
                <div class="animate-pulse mb-2">● ● ●</div>
                データを読み込んでいます
            </div>
        </div>
    </div>

    <!-- 確認モーダル -->
    <div id="confirm-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-6 bg-black/60 backdrop-blur-sm">
        <div class="bg-white w-full max-w-xs rounded-[2.5rem] shadow-2xl overflow-hidden animate-pop">
            <div class="p-8 text-center">
                <div id="modal-message" class="mb-8"></div>
                <div class="flex flex-col gap-3">
                    <button id="modal-confirm-btn" onclick="executeToggle()" class="w-full">確定</button>
                    <button onclick="closeModal()" class="w-full py-4 text-gray-400 font-bold hover:text-gray-600 transition-colors">キャンセル</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
